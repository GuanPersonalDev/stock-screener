[project]
name = "sql-stock-screener"
version = "0.1.0"
description = "TWSE stock screener and simulated trading with MS SQL Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
